<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>S.T.E.P — Canivete de Tarefas</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- ============================================ -->
    <!-- CABEÇALHO -->
    <!-- ============================================ -->
    <header>
        <h1>S_T_E_P</h1>
        <p>Canivete de Tarefas</p>
    </header>

    <!-- ============================================ -->
    <!-- ALTERNADOR DE MODOS -->
    <!-- ============================================ -->
    <nav class="modos" aria-label="Modos de visualização">
        <button type="button" data-modo="kanban" class="ativo">📋 Kanban</button>
        <button type="button" data-modo="acervo">📚 Acervo</button>
        <button type="button" data-modo="mapa">🕸️ Mapa</button>
        <button type="button" data-modo="legado">📤 Legado</button>
    </nav>

    <!-- ============================================ -->
    <!-- REGIÃO DE STATUS (acessibilidade) -->
    <!-- ============================================ -->
    <div id="status-region" role="status" aria-live="polite"></div>

    <!-- ============================================ -->
    <!-- MODO: KANBAN -->
    <!-- ============================================ -->
    <section id="modo-kanban" class="modo ativo">
        <section class="busca-filtros">
            <label for="titulo-tarefa">Título da tarefa:</label>
            <input type="text" id="titulo-tarefa" placeholder="Digite o título da tarefa" />

            <label for="status">Status:</label>
            <select id="status">
                <option value="todos">Todos</option>
                <option value="fazer">A fazer</option>
                <option value="andamento">Em andamento</option>
                <option value="revisao">Revisão</option>
                <option value="concluida">Concluída</option>
            </select>

            <fieldset>
                <legend>Prioridade</legend>
                <label><input type="radio" name="prioridade" value="baixa" /> Baixa</label>
                <label><input type="radio" name="prioridade" value="media" /> Média</label>
                <label><input type="radio" name="prioridade" value="alta" /> Alta</label>
            </fieldset>

            <label for="ordenacao">Ordenar por:</label>
            <select id="ordenacao">
                <option value="padrao">Padrão</option>
                <option value="prazo">Prazo</option>
            </select>

            <button type="button" id="btn-filtrar">Filtrar</button>
            <button type="button" id="btn-limpar">Limpar filtros</button>
        </section>

        <div class="barra-acoes-kanban">
            <button type="button" id="btn-nova-tarefa" class="btn-nova-tarefa">
                ➕ Nova Tarefa
            </button>
        </div>

        <div id="tarefas-container"></div>
    </section>

    <!-- ============================================ -->
    <!-- MODO: ACERVO -->
    <!-- ============================================ -->
    <section id="modo-acervo" class="modo">
        <h2>📚 Acervo Vivo</h2>

        <section class="busca-filtros">
            <label for="busca-acervo">Buscar por título ou tag:</label>
            <input type="text" id="busca-acervo" placeholder="Ex: JavaScript, HTML..." />

            <div class="tags-disponiveis">
                <span class="label-tags">Filtrar por tag:</span>
                <div id="acervo-tags" class="lista-tags"></div>
            </div>
        </section>

        <div id="acervo-container"></div>
    </section>

    <!-- ============================================ -->
    <!-- MODO: MAPA -->
    <!-- ============================================ -->
    <section id="modo-mapa" class="modo">
        <h2>🕸️ Mapa de Conexões</h2>

        <section class="busca-filtros">
            <div class="tags-disponiveis">
                <span class="label-tags">Filtrar por tag:</span>
                <div id="mapa-tags" class="lista-tags"></div>
            </div>
        </section>

        <div id="mapa-container"></div>
    </section>

    <!-- ============================================ -->
    <!-- MODO: LEGADO -->
    <!-- ============================================ -->
    <section id="modo-legado" class="modo">
        <h2>📤 Legado — Tutoriais Publicados</h2>

        <section class="busca-filtros">
            <label for="busca-legado">Buscar por título ou tag:</label>
            <input type="text" id="busca-legado" placeholder="Ex: JavaScript, HTML..." />

            <div class="tags-disponiveis">
                <span class="label-tags">Filtrar por tag:</span>
                <div id="legado-tags" class="lista-tags"></div>
            </div>
        </section>

        <div id="legado-container"></div>
    </section>

    <!-- ============================================ -->
    <!-- MODAL -->
    <!-- ============================================ -->
    <div id="modal" class="modal" hidden>
        <div class="modal-conteudo">
            <button type="button" class="modal-fechar" aria-label="Fechar">✕</button>
            <div id="modal-corpo"></div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- FOOTER -->
    <!-- ============================================ -->
    <footer>
        <div class="redes-sociais">
            <h4>Me acompanhe também:</h4>
            <div class="icones-sociais">
                <a href="https://github.com/Izzieee" target="_blank" aria-label="Nossa página no GitHub">
                    <img id="icone-github" src="logo/github.png" alt="" />
                </a>
                <a href="https://www.instagram.com/jacy_martins_" target="_blank" aria-label="Nosso perfil no Instagram">
                    <img src="logo/instagram.png" alt="" />
                </a>
                <a href="https://www.linkedin.com/in/jacyane-martins-a6b0723a3" target="_blank" aria-label="Nossa página no LinkedIn">
                    <img src="logo/linkedln.png" alt="" />
                </a>
            </div>
        </div>
        <p>&copy; S.T.E.P — Canivete de Tarefas | Jacyane Carvalho Martins</p>
        <p>Última atualização: 18/09/2026</p>
    </footer>

    <!-- ============================================ -->
    <!-- SCRIPT PRINCIPAL -->
    <!-- ============================================ -->
    <script type="module" src="./js/app.js"></script>
</body>
</html>
